name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the last release's version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

# Every job states what its token may do; nothing is granted by default.
permissions: {}

# One release at a time; a second run waits instead of computing the same next version.
concurrency:
  group: release
  cancel-in-progress: false

# Third-party npm code (web-ext, the Chrome Web Store uploader) only runs in `lint`, `cws` and `amo`. Each of those
# jobs holds at most its own store's secrets and a read-only token. The jobs that hold the release-writing token
# (`release`, `attach`) or the Edge secrets (`release`) install no npm dependencies. Files cross jobs as artifacts and
# are checked against the digests `release` recorded before any of them could be touched.
jobs:
  # web-ext lint on its own build of the same commit, with no secrets. CI lints every commit on main too; this keeps
  # a lint failure from producing a release.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: ./build.sh

      # Nothing in the lockfile needs an install script.
      - run: npm ci --ignore-scripts

      - run: npm run lint

  release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Required reviewers on this environment (Settings > Environments > store) hold this job, and the store jobs
    # below, before any step. Its secrets can live there instead of the repository.
    environment: store
    env:
      # A step's `if` cannot see that step's own env, so this boolean lives here; the Edge secrets stay in its step.
      HAS_EDGE: ${{ secrets.EDGE_PRODUCT_ID != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      chrome_sha256: ${{ steps.digests.outputs.chrome }}
      firefox_sha256: ${{ steps.digests.outputs.firefox }}
      # Job-level `if` cannot read secrets, so this job tells the store jobs whether theirs are configured.
      has_cws: ${{ steps.stores.outputs.cws }}
      has_amo: ${{ steps.stores.outputs.amo }}
      edge: ${{ steps.edge.outcome }}
    steps:
      - name: Releases are cut from main only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on the main branch."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: A pushed tag must point at a commit on main
        if: github.event_name == 'push'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$GITHUB_REF_NAME is not on $DEFAULT_BRANCH; releases are cut from reviewed commits only."
            exit 1
          fi

      - name: Which stores are configured
        id: stores
        env:
          HAS_CWS: ${{ secrets.CWS_EXTENSION_ID != '' }}
          HAS_AMO: ${{ secrets.AMO_JWT_ISSUER != '' }}
        run: |
          echo "cws=$HAS_CWS" >> "$GITHUB_OUTPUT"
          echo "amo=$HAS_AMO" >> "$GITHUB_OUTPUT"

      - name: jq is installed
        run: |
          if ! command -v jq > /dev/null; then
            echo "::error::jq is missing on this runner; build.sh and the manifest checks need it."
            exit 1
          fi
          jq --version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [ -z "$last" ]; then
              echo "::error::No release tag (vX.Y.Z) to bump from; push the first tag by hand."
              exit 1
            fi
            if [ "$(git rev-list -n 1 "$last")" = "$GITHUB_SHA" ]; then
              # A re-run after a partial failure: this commit is already released under $last.
              echo "::warning::$GITHUB_SHA is already released as $last; refreshing that release (bump=$BUMP ignored)."
              version="${last#v}"
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              case "$BUMP" in
                major) version="$((major + 1)).0.0" ;;
                minor) version="$major.$((minor + 1)).0" ;;
                *) version="$major.$minor.$((patch + 1))" ;;
              esac
            fi
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"

      # The tag is the source of truth; the manifest in the repository keeps whatever version it last had.
      - name: Stamp the version into the manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json

      # The tests load only node: built-ins and build.sh only uses system tools; this job never installs the npm
      # dependencies.
      - run: npm test

      - run: ./build.sh

      # Step and job outputs are fixed once a step ends; the other jobs check every file they receive against them.
      - name: Record the zip digests
        id: digests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for target in chrome firefox; do
            zip="dist/contapp-spv-$target-$VERSION.zip"
            sum=$(/usr/bin/sha256sum "$zip" | cut -d' ' -f1)
            echo "$target=$sum" >> "$GITHUB_OUTPUT"
            echo "\`$sum\`  $(basename "$zip")" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Release manifests carry only production hosts
        run: |
          for target in chrome firefox; do
            jq -e '[.content_scripts[].matches[] | select(test("\\.test/"))] | length == 0' "dist/$target/manifest.json"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-chrome
          path: dist/contapp-spv-chrome-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-firefox
          path: dist/contapp-spv-firefox-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          CHROME_SHA256: ${{ steps.digests.outputs.chrome }}
          FIREFOX_SHA256: ${{ steps.digests.outputs.firefox }}
        run: |
          zips=("dist/contapp-spv-chrome-$VERSION.zip" "dist/contapp-spv-firefox-$VERSION.zip")
          printf '%s  %s\n' "$CHROME_SHA256" "${zips[0]}" "$FIREFOX_SHA256" "${zips[1]}" | /usr/bin/sha256sum --check --strict -
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-run: keep the release and its notes, refresh the assets.
            gh release upload "$TAG" "${zips[@]}" --clobber
          else
            gh release create "$TAG" "${zips[@]}" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

      # Edge needs only curl, so it stays in this job. It may fail (a store that already has this version refuses it
      # on a re-run) without stopping the other stores; the `result` job turns its failure into a red run.
      - name: Publish to Edge Add-ons
        id: edge
        if: env.HAS_EDGE == 'true'
        continue-on-error: true
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          CHROME_SHA256: ${{ steps.digests.outputs.chrome }}
        run: |
          echo "$CHROME_SHA256  dist/contapp-spv-chrome-$VERSION.zip" | /usr/bin/sha256sum --check --strict -
          api="https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions"
          auth=(-H "Authorization: ApiKey $EDGE_API_KEY" -H "X-ClientID: $EDGE_CLIENT_ID")
          tmp=$(mktemp -d)

          # Starts an operation and prints the operation id from the Location header. Diagnostics go to stderr:
          # stdout is captured by the caller.
          operation() {
            if ! curl -sS --fail-with-body "${auth[@]}" -D "$tmp/headers" -o "$tmp/body" "$@"; then
              { cat "$tmp/body"; echo; echo "::error::Edge request failed"; } >&2
              return 1
            fi
            awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); n = split($2, parts, "/"); print parts[n] }' "$tmp/headers"
          }

          wait_for() {
            failed_polls=0
            for _ in $(seq 1 60); do
              if ! body=$(curl -sS --fail-with-body "${auth[@]}" "$1"); then
                # Edge documents 429 and 500 as transient; give up only when they persist.
                failed_polls=$((failed_polls + 1))
                [ "$failed_polls" -lt 3 ] || { echo "::error::Polling $1 keeps failing"; return 1; }
                sleep 10
                continue
              fi
              status=$(jq -r '.status' <<< "$body")
              case "$status" in
                Succeeded) return 0 ;;
                InProgress) sleep 10 ;;
                *) echo "$body"; echo "::error::Edge operation ended with status '$status'"; return 1 ;;
              esac
            done
            echo "::error::Timed out waiting for $1"
            return 1
          }

          upload=$(operation -H "Content-Type: application/zip" \
            --data-binary @"dist/contapp-spv-chrome-$VERSION.zip" "$api/draft/package")
          [ -n "$upload" ] || { echo "::error::No operation id for the package upload"; exit 1; }
          wait_for "$api/draft/package/operations/$upload"

          publish=$(operation -X POST -H "Content-Type: application/json" -d "{\"notes\":\"Release $TAG\"}" "$api")
          [ -n "$publish" ] || { echo "::error::No operation id for the publish request"; exit 1; }
          wait_for "$api/operations/$publish"

  cws:
    needs: release
    if: needs.release.outputs.has_cws == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    environment: store
    steps:
      # The lockfile pins the uploader; the checkout only provides package.json and package-lock.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Fetched through the REST API (gh is preinstalled), checked against the digest `release` recorded. The token
      # reaches only this step, before any dependency is installed.
      - name: Fetch the Chrome zip built by the release job
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          CHROME_SHA256: ${{ needs.release.outputs.chrome_sha256 }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=release-chrome" \
            --jq '[.artifacts[] | select(.expired | not)] | max_by(.created_at) | .id')
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::No release-chrome artifact in this run"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/artifact.zip"
          mkdir -p "$RUNNER_TEMP/release"
          unzip -q -o "$RUNNER_TEMP/artifact.zip" -d "$RUNNER_TEMP/release"
          echo "$CHROME_SHA256  $RUNNER_TEMP/release/contapp-spv-chrome-$VERSION.zip" | /usr/bin/sha256sum --check --strict -

      # Nothing in the lockfile needs an install script.
      - run: npm ci --ignore-scripts

      - name: Publish to the Chrome Web Store
        env:
          VERSION: ${{ needs.release.outputs.version }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          # Chrome Web Store API v2 addresses items as publishers/<publisher id>/items/<extension id>.
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CHROME_SHA256: ${{ needs.release.outputs.chrome_sha256 }}
        # chrome-webstore-upload-cli is a pinned devDependency, so npm ci installed it from the lockfile.
        # Without a subcommand it uploads and publishes.
        run: |
          zip="$RUNNER_TEMP/release/contapp-spv-chrome-$VERSION.zip"
          echo "$CHROME_SHA256  $zip" | /usr/bin/sha256sum --check --strict -
          npx --no-install chrome-webstore-upload --source "$zip"

  amo:
    needs: release
    if: needs.release.outputs.has_amo == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    environment: store
    outputs:
      xpi: ${{ steps.sign.outputs.xpi }}
      xpi_sha256: ${{ steps.sign.outputs.sha256 }}
    steps:
      # The lockfile pins web-ext; the checkout only provides package.json and package-lock.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Fetch the Firefox zip built by the release job
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          FIREFOX_SHA256: ${{ needs.release.outputs.firefox_sha256 }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=release-firefox" \
            --jq '[.artifacts[] | select(.expired | not)] | max_by(.created_at) | .id')
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::No release-firefox artifact in this run"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/artifact.zip"
          mkdir -p "$RUNNER_TEMP/release"
          unzip -q -o "$RUNNER_TEMP/artifact.zip" -d "$RUNNER_TEMP/release"
          echo "$FIREFOX_SHA256  $RUNNER_TEMP/release/contapp-spv-firefox-$VERSION.zip" | /usr/bin/sha256sum --check --strict -

      # Nothing in the lockfile needs an install script.
      - run: npm ci --ignore-scripts

      # Signs exactly what the verified zip holds. The digest of the signed file becomes a job output, which `attach`
      # checks before the file goes on the release.
      - name: Sign for Firefox (unlisted)
        id: sign
        env:
          VERSION: ${{ needs.release.outputs.version }}
          FIREFOX_SHA256: ${{ needs.release.outputs.firefox_sha256 }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          zip="$RUNNER_TEMP/release/contapp-spv-firefox-$VERSION.zip"
          echo "$FIREFOX_SHA256  $zip" | /usr/bin/sha256sum --check --strict -
          rm -rf "$RUNNER_TEMP/amo-source" "$RUNNER_TEMP/signed"
          unzip -q "$zip" -d "$RUNNER_TEMP/amo-source"
          npx --no-install web-ext sign --source-dir "$RUNNER_TEMP/amo-source" --channel unlisted \
            --artifacts-dir "$RUNNER_TEMP/signed"
          shopt -s nullglob
          xpis=("$RUNNER_TEMP"/signed/*.xpi)
          [ "${#xpis[@]}" -eq 1 ] || { echo "::error::Expected one signed .xpi, found ${#xpis[@]}"; exit 1; }
          echo "xpi=$(basename "${xpis[0]}")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(/usr/bin/sha256sum "${xpis[0]}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-xpi
          path: ${{ runner.temp }}/signed/${{ steps.sign.outputs.xpi }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Holds the release-writing token, runs no npm code and no checkout: it only moves the signed file AMO returned
  # onto the release, after checking it against the digest `amo` recorded.
  attach:
    needs: [release, amo]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Attach the signed Firefox build to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          XPI: ${{ needs.amo.outputs.xpi }}
          XPI_SHA256: ${{ needs.amo.outputs.xpi_sha256 }}
        run: |
          case "$XPI" in
            ""|*/*|.*) echo "::error::Unexpected signed file name: '$XPI'"; exit 1 ;;
          esac
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=signed-xpi" \
            --jq '[.artifacts[] | select(.expired | not)] | max_by(.created_at) | .id')
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::No signed-xpi artifact in this run"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/artifact.zip"
          mkdir -p "$RUNNER_TEMP/signed"
          unzip -q -o "$RUNNER_TEMP/artifact.zip" -d "$RUNNER_TEMP/signed"
          echo "$XPI_SHA256  $RUNNER_TEMP/signed/$XPI" | /usr/bin/sha256sum --check --strict -
          gh release upload "$TAG" "$RUNNER_TEMP/signed/$XPI" --clobber --repo "$GITHUB_REPOSITORY"

  # The store jobs run independently, so one store refusing the version (as on a re-run) does not stop the others;
  # this job turns any failure into a red run.
  result:
    needs: [lint, release, cws, amo, attach]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every configured store took the release
        env:
          RESULTS: >-
            lint=${{ needs.lint.result }} release=${{ needs.release.result }} edge=${{ needs.release.outputs.edge }} cws=${{ needs.cws.result }}
            amo=${{ needs.amo.result }} amo-attach=${{ needs.attach.result }}
        run: |
          echo "$RESULTS"
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            echo "::error::A release or store job failed: $RESULTS"
            exit 1
          fi
